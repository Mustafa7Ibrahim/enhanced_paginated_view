version: 3.0.0
homepage: https://github.com/Mustafa7Ibrahim/enhanced_paginated_view
repository: https://github.com/Mustafa7Ibrahim/enhanced_paginated_view
issue_tracker: https://github.com/Mustafa7Ibrahim/enhanced_paginated_view/issues

environment:
  sdk: ">=3.0.5 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
